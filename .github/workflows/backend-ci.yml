name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores del mismo PR/branch si llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ASISYA.sln

      - name: Compilar (Release)
        run: dotnet build ASISYA.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test ASISYA.sln --no-build --configuration Release --verbosity normal
