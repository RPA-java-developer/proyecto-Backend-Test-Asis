services:

  # ==========================================
  # FRONTEND
  # React + Vite + Nginx
  # ==========================================

  frontend:
    build:
      context: D:/A_finanzauto/asisya-frontend
      dockerfile: Dockerfile

    container_name: asisya-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - api

    networks:
      - app-network


  # ==========================================
  # BACKEND - .NET 8
  # ==========================================

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5146:5146"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network


  # ==========================================
  # DATABASE - MySQL
  # ==========================================

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: --lower-case-table-names=1
    
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-network


# ==========================================
# VOLUMES
# ==========================================

volumes:
  mysql_data:


# ==========================================
# NETWORK
# ==========================================

networks:
  app-network:
    driver: bridge
